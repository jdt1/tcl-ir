<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">Automatic TV wake flow</title>
  <desc id="desc">Windows receives keyboard or mouse input after the display has been off. Before the television's ten-minute standby timeout it restores HDMI without infrared. After standby it sends infrared power before restoring HDMI.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="590" rx="14" fill="#ffffff" stroke="#dbe2ea"/>
  <text x="40" y="48" fill="#172033" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Automatic TV wake</text>

  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="280" y="78" width="340" height="72" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="450" y="108" fill="#172033" font-size="16" font-weight="600">Keyboard or mouse input</text>
    <text x="450" y="132" fill="#64748b" font-size="13">Windows wakes the display</text>

    <rect x="280" y="190" width="340" height="82" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="450" y="222" fill="#172033" font-size="16" font-weight="600">Display-on event</text>
    <text x="450" y="247" fill="#64748b" font-size="13">Requires recent keyboard or mouse input</text>

    <path d="M450 310 570 375 450 440 330 375z" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="370" fill="#172033" font-size="16" font-weight="600">How long was the</text>
    <text x="450" y="393" fill="#172033" font-size="16" font-weight="600">display off?</text>

    <rect x="55" y="478" width="330" height="76" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="220" y="508" fill="#172033" font-size="16" font-weight="600">Before TV standby</text>
    <text x="220" y="533" fill="#64748b" font-size="13">Restore HDMI without IR</text>

    <rect x="515" y="478" width="330" height="76" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="680" y="508" fill="#172033" font-size="16" font-weight="600">After TV standby</text>
    <text x="680" y="533" fill="#64748b" font-size="13">Send IR, wait for the TV, then restore HDMI</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M450 150v30"/>
    <path d="M450 272v28"/>
    <path d="M330 375H220v93"/>
    <path d="M570 375h110v93"/>
  </g>

  <g fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">
    <text x="233" y="363">Under 10m 10s</text>
    <text x="586" y="363">10m 10s or more</text>
  </g>
</svg>
